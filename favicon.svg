<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32283A"/>
      <stop offset="100%" stop-color="#1A161E"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0A0B0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A87986"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#A87986" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Smooth Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#plumGrad)" stroke="#A87986" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Clinical Metabolic Activity Pulse Line -->
  <path d="M 10 32 L 20 32 L 25 18 L 33 46 L 39 24 L 44 36 L 48 32 L 54 32" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Small Precision Metabolic Dot -->
  <circle cx="54" cy="32" r="2.8" fill="#FFFFFF"/>
</svg>
